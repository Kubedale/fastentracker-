name: Fastentracker veröffentlichen

on:
  workflow_dispatch:         # von Hand starten (Actions → "Fastentracker veröffentlichen" → Run workflow)
  push:
    branches: [main, ccr-a546e150-wdk5xw]
    paths: ["index.html", "manifest.webmanifest", "sw.js", "icons/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p seite
          cp -r index.html manifest.webmanifest sw.js icons seite/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: seite

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
